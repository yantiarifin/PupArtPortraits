<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Payment Successful - PupArt Portraits</title>
    <link rel="stylesheet" href="/output.css" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body
    class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center"
  >
    <div class="max-w-md w-full mx-4">
      <div class="bg-white rounded-2xl shadow-2xl p-8 text-center">
        <!-- Branding-->
        <div class="w-full flex justify-center bg-slate-800 p-4 mb-6 rounded-lg">
          <div class="logo text-rose-500 font-semibold text-2xl tracking-tight">
            <i class="fa-solid fa-paw text-cyan-400"></i> PUP<span
              class="text-amber-400"
              >ART</span
            >
            <span class="text-white font-light">portraits&nbsp;</span>
          </div>
        </div>

        <!-- Success Icon -->
        <div
          class="mx-auto w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mb-4"
        >
          <i class="fas fa-check text-green-500 text-3xl"></i>
        </div>

        <h1 class="text-2xl font-bold text-slate-800 mb-2">
          Payment Successful!
        </h1>
        <p class="text-slate-600 mb-6">Thank you for your order!</p>

        <!-- <div class="bg-slate-50 rounded-lg p-4 mb-6">
                <p class="text-sm text-slate-700">
                    We've received your payment and will begin working on your portrait right away.
                </p>
            </div>
             -->
        <div class="bg-blue-50 border border-blue-200 rounded-lg p-4 mb-6">
          <p class="text-sm text-blue-800">
            <i class="fas fa-envelope mr-2"></i>
            A confirmation email has been sent with your order details.
          </p>
        </div>

        <div class="text-center mb-6">
          <h4 class="font-semibold text-sm text-slate-700 mb-2">
            What happens next?
          </h4>
          <p>
            Please allow up to one week to receive a preview. Prints will ship
            within 2 days approval.
          </p>
          <!-- <ul class="text-sm text-slate-600 space-y-1">
                    <li>• We'll start creating your portrait within 24 hours</li>
                    <li>• You'll receive a preview for approval in 3-5 business days</li>
                    <li>• Prints ship within 2 days of approval</li>
                </ul> -->
        </div>

        <a
          href="/"
          class="bg-sky-500 text-white py-3 px-6 rounded-lg hover:bg-sky-600 transition-colors font-medium inline-block"
        >
          Return to Home
        </a>
      </div>
    </div>

    <script>
      // Process the successful payment
      const urlParams = new URLSearchParams(window.location.search);
      const sessionId = urlParams.get("session_id");

      if (sessionId) {
        // Get the pending order from localStorage
        const pendingOrder = localStorage.getItem("pendingOrder");
        if (pendingOrder) {
          // Submit the order to your backend
          fetch("/api/submit-order.php", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: pendingOrder,
          })
            .then((response) => response.json())
            .then((result) => {
              console.log("Order saved:", result);
              // Clear the pending order
              localStorage.removeItem("pendingOrder");
            })
            .catch((error) => {
              console.error("Error saving order:", error);
            });
        }
      }
    </script>
  </body>
</html>
